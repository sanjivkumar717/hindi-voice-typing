plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.speech'
    compileSdk 34

    defaultConfig {
        applicationId "com.offline.speech"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // core dependencies
}
